<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pip Pop Yes Yeesh Music Experience</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.159.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.159.0/examples/jsm/",
                "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <div id="loading-screen">
        <div class="loading-content">
            <h1>Pip Pop Yes Yeesh</h1>
            <p>Music Experience</p>
            <div class="loading-bar"><div class="loading-progress"></div></div>
            <p class="loading-message">Welcome to the ultimate club experience</p>
            <!-- Start button will be added dynamically -->
        </div>
    </div>
    
    <div id="scene-container"></div>
    
    <div id="ui-container">
        <div id="outside-club" class="scene active">
            <div class="scene-info">
                <h2><i class="fas fa-volume-down"></i> Pip Pop Yes Yeesh</h2>
                <p>The hottest club in town is playing your favorite track</p>
            </div>
            <div class="door-btn">
                <button id="enter-club"><i class="fas fa-door-open"></i> Enter the Club</button>
            </div>
        </div>
        
        <div id="inside-club" class="scene">
            <div class="controls">
                <button id="toggle-dance"><i class="fas fa-music"></i> Dance!</button>
                <button id="exit-club"><i class="fas fa-sign-out-alt"></i> Exit</button>
            </div>
            <div class="track-info">
                <div class="dj-info">
                    <span>Now Playing:</span>
                    <h3>Pip Pop Yes Yeesh</h3>
                </div>
            </div>
        </div>
    </div>
    
    <div id="instructions">
        <div class="instruction-content">
            <p><i class="fas fa-mouse"></i> Drag to look around inside the club</p>
            <p><i class="fas fa-music"></i> Click Dance to sync with the beat</p>
            <button id="hide-instructions">Got it!</button>
        </div>
    </div>
    
    <div class="volume-indicator">
        <div class="volume-level"></div>
    </div>
    
    <script type="module" src="app.js"></script>

</body>
</html>
